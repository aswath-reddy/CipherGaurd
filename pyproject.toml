[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherguard"
version = "1.0.0"
description = "CipherGuard: A Policy-Aware Safety Router with Removal-Based Token Attribution for LLM Applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "transformers>=4.30",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
